<!DOCTYPE html>
<html>
    <head>
        <title> Log in Form in HTML CSS</title>
        <link rel="stylesheet" href="styles.css">
        <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
        
    </head>
    <body>
        <div class="wrapper">
            <from action="">
                <h1>Login</h1>
                <div class="input-box">
                    <input type="text" placeholder="Username" required><i class="bx bx-user"></i>

                </div>
                <div class="input-box">
                    <input type="password" placeholder="Password"><i class="bx bx-lock"></i> 
                </div>
                <div class="remeber-forgot">
                    <label><input type="checkbox">Remeber Me</label>
                    <a href="#">Forgot password</a>
                </div>

                <button type="submit" class="btn">Login</button>

                <div class="register-link"><p>Don't Have any Account? <a href="#">Register</a></p></div>
            </from>

        </div>
    </body>
</html>
